---
- name: Install Apache (httpd) on Amazon Linux
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Change Apache listen port to 81
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^Listen 80'
    line: 'Listen 81'

- name: Start and enable Apache service
  ansible.builtin.service:
    name: httpd
    state: restarted
    enabled: true
